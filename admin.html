</head><body><header class="site-header">

                         <main><section class="section admin-wrap"><div class="section-heading">
                            <div><h2>⚙ <span>ADMIN <em>DASHBOARD</em></span></h2>
                                <p>Manage public downloads and scripts.</p></div></div>
                                <div class="admin-tabs"><button class="admin-tab active" data-panel="downloadPanel">Upload Download</button><button class="admin-tab" data-panel="scriptPanel">Upload Script</button><button class="admin-tab" data-panel="managePanel">Manage Scripts</button><button class="admin-tab" data-panel="manageDownloadPanel">Manage Downloads</button></div><div id="downloadPanel" class="admin-panel"><form id="uploadForm" class="admin-form"><label>File name<input id="fileName" required placeholder="Example: Kafka Hub Tool"></label><label>Description<textarea id="description" placeholder="Describe this file"></textarea></label><label>Category<input id="category" placeholder="Game, Tool, Update..."></label><label>Select file<input id="file" type="file" required></label><button class="primary-btn" type="submit">Upload File →</button><p id="uploadMessage"></p></form></div><div id="scriptPanel" class="admin-panel" hidden><form id="scriptForm" class="admin-form"><input id="scriptId" type="hidden"><label>Script title<input id="scriptTitle" required placeholder="Example: Auto Farm Script"></label><label>Game / Experience<input id="scriptGame" placeholder="Example: Grow a Garden"></label><label>Category<input id="scriptCategory" placeholder="Keyless, Verified, Open Source..."></label><label>Description<textarea id="scriptDescription" placeholder="Describe what the script does"></textarea></label><label>Script file (.lua, .txt, .json)<input id="scriptFile" type="file" accept=".lua,.txt,.json,.js" required></label><button class="primary-btn" type="submit">Upload Script →</button><button id="cancelEdit" class="outline-btn" type="button" hidden>Cancel Edit</button><p id="scriptMessage"></p></form></div><div id="managePanel" class="admin-panel" hidden><div id="adminScriptList" class="admin-items"></div><p id="manageMessage"></p></div><div id="manageDownloadPanel" class="admin-panel" hidden><div id="adminDownloadList" class="admin-items"></div><p id="manageDownloadMessage"></p></div><div class="admin-note"><b>Security:</b> This dashboard requires Supabase Auth. Database and Storage RLS policies in README.txt must also be installed. Only users in the <code>admin_users</code> table can upload, edit, or delete.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
